name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      port:
        description: 'Host port to deploy this instance on'
        required: false
        default: '8080'
      ref:
        description: 'Branch, tag or hash to use'
        required: false
        default: 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve deploy variables
        run: |
          PORT="${{ github.event.inputs.port || '8080' }}"
          echo "PORT=$PORT" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=sizematters-server-$PORT" >> "$GITHUB_ENV"
          echo "CONTAINER_NAME=sizematters-server-$PORT" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@3

      - name: Build image
        uses: docker/build-push-action@6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:latest
          outputs: type=docker,dest=${{ env.IMAGE_NAME }}.tar
          # Speeds up rebuilds by caching Docker layers between workflow runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress image
        run: gzip ${{ env.IMAGE_NAME }}.tar

      - name: Copy image to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: ${{ env.IMAGE_NAME }}.tar.gz
          target: /tmp/

      - name: Load image and restart container
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            docker load < /tmp/${{ env.IMAGE_NAME }}.tar.gz
            rm /tmp/${{ env.IMAGE_NAME }}.tar.gz

            # Stop instance running on this port
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true

            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              -p ${{ env.PORT }}:8080 \
              -e RUST_LOG=actix_server=info,actix_web=info \
              --restart unless-stopped \
              ${{ env.IMAGE_NAME }}:latest

            docker image prune -f