[package]
name = "sizematters-server"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
actix = "0.13"
actix-web = "4"
actix-web-actors = "4"
actix-rt = "2"
actix-files = "0.7"
env_logger = "0.11"

uuid = { version = "1", features = ["v4"] }

md5 = "0.8"

regex = "1"

serde_json = "1.0"

rand = "0.10"

sizematters-shared = { path = "../shared", features = ["actix"] }
