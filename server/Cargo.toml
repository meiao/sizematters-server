[package]
name = "sizematters-server"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
actix = "0.13"
actix-files = "0.7"
actix-rt = "2"
actix-web = "4"
actix-web-actors = "4"
dicebear-core = "10.7.0"
dicebear-styles = { version = "10.6.0", features = [
    "blobs",
    "glass",
    "identicon",
    "pixelbot",
    "shapes",
    "squircles",
    "waves"] }
env_logger = "0.11"
md5 = "0.8"
rand = "0.10"
regex = "1"
serde = "1.0"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }


sizematters-shared = { path = "../shared", features = ["actix"] }

[dev-dependencies]
actix-codec = "0.5"
actix-test = "0.1"
awc = "3"
futures-util = "0.3"
strum = "0.27"
