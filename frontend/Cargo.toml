[package]
name = "sizematters-frontend"
version.workspace = true
authors.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = { version = "0.8" }
web-sys = { version = "0.3", features = [
    "WebSocket",
    "MessageEvent",
    "ErrorEvent",
    "Location",
    "Storage",
    "Window",
    "BinaryType",
    "CloseEvent",
    "HtmlDialogElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Navigator",
    "Clipboard",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"
log = "0.4"
console_log = "0.2"
console_error_panic_hook = "0.1"
md5 = "0.7.0"

sizematters-shared = { path = "../shared" }

# rust-ui (https://rust-ui.com) component dependencies
leptos_ui = "0.3.22"
tw_merge = { version = "0.1.21", features = ["variant"] }
icons = { version = "0.18.3", features = ["leptos"] }
strum = { version = "0.27", features = ["derive"] }

[package.metadata.leptos]
# Read by the rust-ui `ui` CLI
tailwind-input-file = "style/tailwind.css"
